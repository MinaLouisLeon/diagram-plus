    <rect x="560" y="464" width="192" height="160" rx="36" fill="#a78bfa"/>
    <rect x="448" y="608" width="192" height="160" rx="36" fill="#34d399"/>
    <rect x="704" y="608" width="160" height="160" rx="36" fill="#fbbf24"/>
